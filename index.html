<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE TV ULTRA PLAYER</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:0;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:#1f1f1f;padding:15px 0;text-align:center;font-size:24px;font-weight:bold;color:#e50914;position:sticky;top:0;z-index:10}
.player-wrapper{width:90%;max-width:850px;margin:20px 0;position:relative;overflow:hidden;border-radius:12px;background:#000}
video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.filter-container{width:90%;max-width:850px;margin-bottom:20px}
.filter-title{font-size:14px;text-transform:uppercase;color:#aaa;margin-bottom:8px;letter-spacing:1px}
.filter-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.filter-btn{background:#222;color:#ccc;border:1px solid #444;padding:8px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.filter-btn.active,.filter-btn:hover{background:#e50914;color:#fff;border-color:#e50914}
.channels-section{width:90%;max-width:850px;margin-top:10px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-bottom:50px}
.channel-card{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:8px;padding:20px 10px;text-align:center;cursor:pointer;position:relative}
.channel-card:hover{transform:translateY(-5px);border-color:#e50914}
.channel-card img{width:60px;height:45px;object-fit:contain;background:#fff;border-radius:8px;display:block;margin:0 auto 10px}
#err{width:90%;max-width:850px;background:#3a0000;color:#ffaaaa;padding:10px;border-radius:8px;display:none;margin:-10px 0 15px;font-size:13px}
.top-btns{display:flex;gap:10px;margin:10px 0}
.top-btns button{background:#e50914;color:#fff;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-weight:bold}
.quality-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:-10px 0 15px}
.quality-bar label{font-size:14px;font-weight:bold;color:#fff}
.quality-bar select{background:#222;color:#fff;border:1px solid #444;padding:10px 14px;border-radius:8px;font-size:15px;outline:none;min-width:140px;cursor:pointer}
.quality-bar .q-info{font-size:12px;color:#aaa}
.online-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-5px 0 15px}
.online-dot{width:10px;height:10px;background:#00ff00;border-radius:50%;display:inline-block;box-shadow:0 0 8px #00ff00;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.card-online{font-size:11px;color:#00ff00;background:#0a2a0a;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:6px}
.epg-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px 14px;margin:-5px 0 15px}
.epg-now{font-size:14px;color:#fff;line-height:1.5}
.epg-next{font-size:13px;color:#aaa;line-height:1.5;margin-top:4px}
.epg-time{color:#e50914;font-weight:bold}
</style>
</head>
<body>
<header>📺 LIVE TV ULTRA PLAYER <div id="istClock" style="font-size:13px;color:#fff;font-weight:normal;margin-top:4px">🕐 IST Time Loading...</div></header>
<div class="player-wrapper">
<video id="tv-player" controls autoplay muted playsinline></video>
</div>
<div id="err"></div>
<p id="status" style="color:#aaa;margin:-10px 0 15px">Loading channels...</p>
<div class="online-bar">
  <div style="display:flex;gap:8px;align-items:center">
    <span class="online-dot"></span>
    <b id="onlineCount" style="color:#fff;font-size:15px">👁️ 1 Online Dekh Rahe Hai</b>
  </div>
  <span id="liveChannelName" style="color:#e50914;font-size:13px;font-weight:bold">🔴 LIVE</span>
</div>

<!-- ✅ EPG AUTO BAR -->
<div class="epg-bar">
  <div class="epg-now" id="epgNow">📺 <b>Abhi :</b> <span id="epgNowText">EPG Load Ho Raha Hai... ⏳</span></div>
  <div class="epg-next" id="epgNext">⏭️ <b>Agle :</b> <span id="epgNextText">-</span></div>
  <div style="font-size:11px;color:#666;margin-top:6px" id="epgStatus">EPG Source: Apna epg.xml.gz</div>
</div>

<div class="top-btns">
<button onclick="downloadM3U()">⬇️ M3U Download Karo</button>
<button onclick="reloadM3U()" style="background:#222">🔄 Refresh Channels</button>
<button onclick="loadEPG(true)" style="background:#222">📺 EPG Refresh</button>
</div>
<div class="quality-bar">
  <div style="display:flex;gap:10px;align-items:center">
    <label for="qualitySelect">Quality:</label>
    <select id="qualitySelect" onchange="changeQuality()"><option value="auto" selected>Auto</option></select>
  </div>
  <div class="q-info" id="qualityInfo">Auto - Internet ke hisab se khud badlega</div>
</div>
<div class="filter-container"><div class="filter-title">Languages</div><div class="filter-row" id="language-filters"></div></div>
<div class="filter-container"><div class="filter-title">Categories</div><div class="filter-row" id="category-filters"></div></div>
<div class="channels-section"><div class="filter-title">Available Channels</div><div class="channels-grid" id="channels-list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
let channelsData = [];
let activeLanguage='all', activeCategory='all';
let hls = null;
let DEFAULT_UA = 'Dalvik/2.1.0 (Linux; U; Android 10; SM-G975F Build/QP1A.190711.020)';
let video = document.getElementById('tv-player');
let M3U_URL = 'https://m3u-iptv.github.io/iptv/index.m3u';
let PROXIES = ['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url=','https://api.codetabs.com/v1/proxy?quest='];
let lastM3UText = '';

// ✅ ✅ ✅ APNA EPG LINK - YAHI AAPKA epg.xml.gz HAI SIR ✅ ✅ ✅
let EPG_URLS = [
  'https://m3u-iptv.github.io/iptv/epg.xml.gz',
  'https://m3u-iptv.github.io/iptv/epg.xml',
  'epg.xml.gz',
  'epg.xml'
];

function updateClock(){
  let el=document.getElementById('istClock');
  if(!el) return;
  let now=new Date();
  let ist=now.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,day:'2-digit',month:'short',year:'numeric'});
  el.innerText='🕐 IST Time : '+ist+' | LIVE';
}
setInterval(updateClock,1000); updateClock();

// ✅ NO KEY ONLINE
let currentChannelSafeName='LIVE';
let onlineTimer=null;
function makeSafeName(name){ return (name||'LIVE').replace(/[^a-zA-Z0-9]/g,'_').substring(0,60); }
async function refreshOnlineCount(){
  try{
    let r=await fetch('https://abacus.jasoncameron.dev/info/m3u-iptv-online/'+currentChannelSafeName);
    let j=await r.json();
    let c=j.value||1;
    if(c<1) c=1;
    document.getElementById('onlineCount').innerText='👁️ '+c.toLocaleString('en-IN')+' Online Dekh Rahe Hai';
    let card=document.getElementById('card-'+currentChannelSafeName);
    if(card) card.innerText='👁️ '+c+' Online';
  }catch(e){}
}
async function startOnlineCounter(channelName){
  currentChannelSafeName=makeSafeName(channelName);
  let nameEl=document.getElementById('liveChannelName');
  if(nameEl) nameEl.innerText='🔴 LIVE : '+channelName;
  try{ await fetch('https://abacus.jasoncameron.dev/hit/m3u-iptv-online/'+currentChannelSafeName); }catch(e){}
  refreshOnlineCount();
  if(onlineTimer) clearInterval(onlineTimer);
  onlineTimer=setInterval(refreshOnlineCount,5000);
}
window.addEventListener('beforeunload',()=>{
  try{ let url='https://abacus.jasoncameron.dev/decrement/m3u-iptv-online/'+currentChannelSafeName; navigator.sendBeacon(url); }catch(e){}
});

// ✅ ✅ ✅ EPG AUTO DOWNLOAD SYSTEM ✅ ✅ ✅
let epgMap = {}; // channelId -> [{start,stop,title,desc}]
let epgNameMap = {}; // channel display name lower -> channelId
let currentChannelObj = null;
let epgLoaded = false;

function parseEPGTime(s){
  if(!s) return null;
  // 20261112103000 +0530  ya  20261112103000
  try{
    s=s.trim();
    let datePart=s.substring(0,14);
    let tzPart=s.substring(15).trim(); // +0530
    let y=datePart.substring(0,4), mo=datePart.substring(4,6), d=datePart.substring(6,8), h=datePart.substring(8,10), mi=datePart.substring(10,12), sec=datePart.substring(12,14);
    if(tzPart && (tzPart[0]==='+'||tzPart[0]==='-')){
      let sign=tzPart[0]==='+'?1:-1;
      let th=parseInt(tzPart.substring(1,3)||'0'), tm=parseInt(tzPart.substring(3,5)||'0');
      let utcMs = Date.UTC(y,mo-1,d,h,mi,sec) - sign*(th*60+tm)*60000;
      return new Date(utcMs);
    }
    return new Date(y+'-'+mo+'-'+d+'T'+h+':'+mi+':'+sec);
  }catch(e){ return null; }
}
function fmtTime(dt){
  if(!dt) return '';
  return dt.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true});
}
async function loadEPG(manual){
  if(epgLoaded && !manual) return;
  document.getElementById('epgNowText').innerText = 'EPG Download Ho Raha Hai... ⏳';
  let xmlText='';
  for(let url of EPG_URLS){
    try{
      let res = await fetch(url);
      if(!res.ok) continue;
      let buf = await res.arrayBuffer();
      let bytes = new Uint8Array(buf);
      // .gz hai to pako se kholo, nahi to direct text
      try{
        if(bytes[0]===0x1f && bytes[1]===0x8b){
          let out = pako.ungzip(bytes);
          xmlText = new TextDecoder().decode(out);
        } else {
          xmlText = new TextDecoder().decode(bytes);
        }
      }catch(e){ xmlText = new TextDecoder().decode(bytes); }
      if(xmlText && xmlText.includes('<programme')) break;
      if(xmlText && xmlText.includes('<tv')) break;
    }catch(e){}
  }
  if(!xmlText || !xmlText.includes('<programme')){
    document.getElementById('epgNowText').innerText = 'EPG Nahi Mila Sir! GitHub Me epg.xml.gz Upload Karo!';
    document.getElementById('epgStatus').innerText = 'EPG Nahi Mila - epg.xml.gz Check Karo';
    return;
  }
  try{
    let parser = new DOMParser();
    let xml = parser.parseFromString(xmlText,'text/xml');
    epgMap={}; epgNameMap={};
    // channel naam map
    xml.querySelectorAll('channel').forEach(ch=>{
      let id=ch.getAttribute('id')||'';
      let dn=ch.querySelector('display-name');
      if(dn && id){ epgNameMap[dn.textContent.trim().toLowerCase()]=id; }
    });
    xml.querySelectorAll('programme').forEach(p=>{
      let ch=p.getAttribute('channel')||'';
      let st=parseEPGTime(p.getAttribute('start'));
      let sp=parseEPGTime(p.getAttribute('stop'));
      let tEl=p.querySelector('title'); let title=tEl?tEl.textContent.trim():'Program';
      let dEl=p.querySelector('desc'); let desc=dEl?dEl.textContent.trim():'';
      if(!epgMap[ch]) epgMap[ch]=[];
      epgMap[ch].push({start:st,stop:sp,title,desc});
    });
    for(let k in epgMap){ epgMap[k].sort((a,b)=>a.start-b.start); }
    epgLoaded=true;
    document.getElementById('epgStatus').innerText = 'EPG Auto Load Ho Gaya ✅ | Total Channels: '+Object.keys(epgMap).length;
    if(currentChannelObj) updateEPG(currentChannelObj);
    else document.getElementById('epgNowText').innerText='Channel Chuno Sir!';
  }catch(e){
    document.getElementById('epgNowText').innerText='EPG Parse Nahi Hua Sir!';
  }
}
function updateEPG(ch){
  currentChannelObj=ch;
  if(!ch){ return; }
  if(!epgLoaded){
    document.getElementById('epgNowText').innerText='EPG Load Ho Raha Hai...';
    return;
  }
  let now=new Date();
  let ids=[];
  if(ch.tvgId) ids.push(ch.tvgId);
  if(ch.name) ids.push(ch.name);
  let lower=ch.name?ch.name.toLowerCase():'';
  if(epgNameMap[lower]) ids.push(epgNameMap[lower]);
  // naam se thoda match bhi try karo
  for(let key in epgNameMap){
    if(key.includes(lower) || lower.includes(key)){ ids.push(epgNameMap[key]); }
  }
  let list=null;
  for(let id of ids){ if(epgMap[id] && epgMap[id].length){ list=epgMap[id]; break; } }
  if(!list){
    document.getElementById('epgNowText').innerText='Is Channel Ka Program Info Nahi Mila Sir!';
    document.getElementById('epgNextText').innerText='-';
    return;
  }
  let cur=null, nxt=null;
  for(let i=0;i<list.length;i++){
    if(now>=list[i].start && now<list[i].stop){ cur=list[i]; nxt=list[i+1]||null; break; }
    if(now<list[i].start){ nxt=list[i]; break; }
  }
  if(cur){
    document.getElementById('epgNowText').innerText = cur.title + '  ('+fmtTime(cur.start)+' - '+fmtTime(cur.stop)+')' + (cur.desc? ' | '+cur.desc.substring(0,80):'');
  } else if(nxt){
    document.getElementById('epgNowText').innerText='Abhi Koi Program Nahi - Agla Program Neeche Hai';
  } else {
    document.getElementById('epgNowText').innerText='Aaj Ka Program Khatam Ho Gaya Sir!';
  }
  if(nxt){
    document.getElementById('epgNextText').innerText = nxt.title + '  ('+fmtTime(nxt.start)+' - '+fmtTime(nxt.stop)+')';
  } else {
    document.getElementById('epgNextText').innerText='-';
  }
}
// Har 1 minute me EPG time update karo, Har 30 minute me EPG dobara download karo
setInterval(()=>{ if(currentChannelObj) updateEPG(currentChannelObj); },60000);
setInterval(()=>{ loadEPG(true); },30*60*1000);

async function fetchM3U(){
  try{ let res = await fetch(M3U_URL); if(res.ok){ let t = await res.text(); if(t.includes('#EXTINF')) return t; } }catch(e){}
  try{ let res = await fetch(PROXIES[0] + encodeURIComponent(M3U_URL)); if(res.ok){ let t = await res.text(); if(t.includes('#EXTINF')) return t; } }catch(e){}
  try{ let res = await fetch('index.m3u'); if(res.ok) return await res.text(); }catch(e){}
  return '';
}
async function loadFromM3U(){
  document.getElementById('status').innerText = 'M3U Auto Download Ho Raha Hai... ⏳';
  let text = await fetchM3U();
  lastM3UText = text;
  channelsData = [];
  if(!text){ document.getElementById('status').innerText = 'M3U Nahi Mila Sir! M3U_URL Check Karo!'; return; }
  let lines = text.split('\n'), cur=null, pendingUA='';
  for(let line of lines){
    line=line.trim();
    if(line.startsWith('#EXTVLCOPT') && line.includes('http-user-agent=')){
      let ua=line.split('http-user-agent=')[1]||'';
      if(cur) cur.userAgent=ua.trim(); else pendingUA=ua.trim();
      continue;
    }
    if(line.startsWith('#EXTINF')){
      let name = line.split(',').pop()||'Channel';
      let logo = (line.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      let tvgId = (line.match(/tvg-id="([^"]*)"/)||[])[1]||'';
      let lang = (line.match(/tvg-language="([^"]*)"/)||[])[1] || 'Others';
      let cat = (line.match(/group-title="([^"]*)"/)||[])[1] || 'Entertainment';
      if(lang==='Others'){ let m=name.match(/\{([^}]+)\}/); if(m) lang=m[1]; }
      cur={name,logo,lang,cat,url:'',userAgent:pendingUA||DEFAULT_UA,tvgId};
      pendingUA='';
    } else if(line.startsWith('http') && cur){ cur.url=line; channelsData.push(cur); cur=null; }
  }
  document.getElementById('status').innerText = channelsData.length + ' Channels Auto Load Ho Gaye ✅';
  buildFilters(); loadChannels();
  loadEPG(false);
  if(channelsData.length) changeChannel(channelsData[0].url, channelsData[0]);
}
function reloadM3U(){ channelsData=[]; loadFromM3U(); }
function downloadM3U(){
  if(!lastM3UText){ alert('Pehle Channels Load Hone Do Sir!'); return; }
  let blob = new Blob([lastM3UText], {type:'audio/x-mpegurl'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.m3u';
  a.click();
}
function buildFilters(){
  let langs=['all',...new Set(channelsData.map(c=>c.lang))];
  let cats=['all',...new Set(channelsData.map(c=>c.cat))];
  document.getElementById('language-filters').innerHTML = langs.map(l=>`<button class="filter-btn ${l==='all'?'active':''}" onclick="filterLanguage('${l}',this)">${l==='all'?'All Languages':l}</button>`).join('');
  document.getElementById('category-filters').innerHTML = cats.map(c=>`<button class="filter-btn ${c==='all'?'active':''}" onclick="filterCategory('${c}',this)">${c==='all'?'All Categories':c}</button>`).join('');
}
function loadChannels(){
  let grid=document.getElementById('channels-list'); grid.innerHTML='';
  let filtered=channelsData.filter(ch=>(activeLanguage==='all'||ch.lang===activeLanguage)&&(activeCategory==='all'||ch.cat===activeCategory));
  if(!filtered.length){ grid.innerHTML='<div style="color:#aaa;padding:20px;text-align:center">Is filter me koi channel nahi hai</div>'; return; }
  filtered.forEach(ch=>{
    let d=document.createElement('div'); d.className='channel-card';
    let safe = makeSafeName(ch.name);
    d.innerHTML=`<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/60x45?text=TV'"><span>${ch.name}</span><br><span class="card-online" id="card-${safe}">👁️ 1 Online</span>`;
    d.onclick=()=>changeChannel(ch.url, ch); grid.appendChild(d);
  });
}
function showErr(msg){ let e=document.getElementById('err'); e.style.display='block'; e.innerHTML=msg; }
function hideErr(){ document.getElementById('err').style.display='none'; }
function changeChannel(url, ch){
  startOnlineCounter(ch ? ch.name : 'LIVE TV');
  updateEPG(ch);
  let qs=document.getElementById('qualitySelect');
  if(qs) qs.innerHTML='<option value="auto" selected>Auto</option>';
  let qi=document.getElementById('qualityInfo');
  if(qi) qi.innerText='Auto - Quality load ho rahi hai...';
  playUrl(url, ch, 0);
}
function playUrl(url, ch, attempt){
  hideErr();
  document.getElementById('status').innerText = 'Playing: ' + (ch?ch.name:'') + ' | Try ' + (attempt+1) + '...';
  let playSrc = url;
  if(url.startsWith('http://') || attempt>0){
    let p = PROXIES[attempt % PROXIES.length];
    playSrc = p + encodeURIComponent(url);
  }
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  if(window.Hls && Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(playSrc);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ updateQualityDropdown(); video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); }); });
    hls.on(Hls.Events.ERROR, function(e,data){
      if(data.fatal){
        if(attempt < 3){ playUrl(url, ch, attempt+1); }
        else { showErr('❌ Ye Link Abhi Server Se Band Hai Sir! Thodi Der Baad Try Karo!'); }
      }
    });
  } else { video.src = playSrc; video.play().catch(()=>{}); }
}
function updateQualityDropdown(){
  let select = document.getElementById('qualitySelect');
  let info = document.getElementById('qualityInfo');
  if(!select || !hls) return;
  select.innerHTML = '<option value="auto" selected>Auto</option>';
  let seen = new Set(); let levels = [];
  hls.levels.forEach((level, index)=>{
    let h = level.height || 0; let w = level.width || 0; let bitrate = Math.round((level.bitrate || 0) / 1000);
    let label = ''; if(h) label = h + 'p'; else if(w) label = w + 'p'; else if(bitrate) label = bitrate + ' kbps'; else label = 'Level ' + (index+1);
    if(seen.has(label)) return; seen.add(label);
    levels.push({index: index, label: label, height: h, bitrate: bitrate});
  });
  levels.sort((a,b)=> b.height - a.height);
  levels.forEach(l=>{ let opt = document.createElement('option'); opt.value = l.index; opt.text = l.label; select.appendChild(opt); });
  if(levels.length === 0){ let opt = document.createElement('option'); opt.value = '0'; opt.text = 'Original'; select.appendChild(opt); if(info) info.innerText = 'Is channel me sirf 1 quality hai'; }
  else { if(info) info.innerText = 'Total ' + levels.length + ' Quality Mili: ' + levels.map(l=>l.label).join(', ') + ' | Auto pe rakho to khud badlega'; }
}
function changeQuality(){
  let select = document.getElementById('qualitySelect');
  let info = document.getElementById('qualityInfo');
  let val = select.value; if(!hls) return;
  if(val === 'auto'){ hls.currentLevel = -1; if(info) info.innerText = 'Auto - Internet ke hisab se khud badlega'; }
  else { let idx = parseInt(val); hls.currentLevel = idx; let txt = select.options[select.selectedIndex].text; if(info) info.innerText = 'Fixed: ' + txt + ' | Wapas Auto karne ke liye Auto chunno'; }
}
function filterLanguage(lang,btn){ activeLanguage=lang; document.querySelectorAll('#language-filters .filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadChannels(); }
function filterCategory(cat,btn){ activeCategory=cat; document.querySelectorAll('#category-filters .filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadChannels(); }
loadFromM3U();
</script>
</body>
</html>
