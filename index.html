<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LIVE TV ULTRA PLAYER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;background:#1f1f1f;padding:15px 0;text-align:center;font-size:24px;font-weight:bold;color:#e50914;position:sticky;top:0;z-index:10}
.player-wrapper{width:90%;max-width:850px;margin:20px 0;position:relative;overflow:hidden;border-radius:12px;background:#000;contain:content}
video{width:100%;aspect-ratio:16/9;background:#000;display:block;transform:translateZ(0)}
.filter-container{width:90%;max-width:850px;margin-bottom:20px}
.filter-title{font-size:14px;text-transform:uppercase;color:#aaa;margin-bottom:8px;letter-spacing:1px}
.filter-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{background:#222;color:#ccc;border:1px solid #444;padding:8px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.filter-btn.active,.filter-btn:hover{background:#e50914;color:#fff;border-color:#e50914}
.channels-section{width:90%;max-width:850px;margin-top:10px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-bottom:50px;content-visibility:auto}
.channel-card{background:#1a1a1a;border:1px solid #2d2d2d;border-radius:8px;padding:20px 10px;text-align:center;cursor:pointer;content-visibility:auto;contain-intrinsic-size:120px;contain:content}
.channel-card:active{transform:scale(0.97)}
.channel-card img{width:60px;height:45px;object-fit:contain;background:#fff;border-radius:8px;display:block;margin:0 auto 10px}
#err{width:90%;max-width:850px;background:#3a0000;color:#ffaaaa;padding:10px;border-radius:8px;display:none;margin:-10px 0 15px;font-size:13px}
.quality-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:-10px 0 15px}
.quality-bar label{font-size:14px;font-weight:bold;color:#fff}
.quality-bar select{background:#222;color:#fff;border:1px solid #444;padding:10px 14px;border-radius:8px;font-size:15px;outline:none;min-width:140px;cursor:pointer}
.quality-bar .q-info{font-size:12px;color:#aaa}
.online-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-5px 0 15px}
.online-dot{width:10px;height:10px;background:#00ff00;border-radius:50%;display:inline-block;box-shadow:0 0 8px #00ff00;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.card-online{font-size:11px;color:#00ff00;background:#0a2a0a;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:6px}
.epg-bar{width:90%;max-width:850px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px 14px;margin:-5px 0 15px;contain:content}
.epg-now{font-size:14px;color:#fff;line-height:1.5}
.epg-next{font-size:13px;color:#aaa;line-height:1.5;margin-top:4px}
</style>
</head>
<body>
<header>📺 LIVE TV ULTRA PLAYER <div id="istClock" style="font-size:13px;color:#fff;font-weight:normal;margin-top:4px">🕐 IST Time Loading...</div></header>
<div class="player-wrapper">
<video id="tv-player" controls autoplay muted playsinline preload="metadata"></video>
</div>
<div id="err"></div>
<p id="status" style="color:#aaa;margin:-10px 0 15px">Loading channels...</p>
<div class="online-bar">
  <div style="display:flex;gap:8px;align-items:center">
    <span class="online-dot"></span>
    <b id="onlineCount" style="color:#fff;font-size:15px">👁️ 1 Online Dekh Rahe Hai</b>
  </div>
  <span id="liveChannelName" style="color:#e50914;font-size:13px;font-weight:bold">🔴 LIVE</span>
</div>

<!-- ✅ EPG - SIRF ABHI / AGLE, BAKI SAB HATA DIYA SIR -->
<div class="epg-bar">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:#fff">📺 EPG</b>
    <button id="epgToggleBtn" onclick="toggleEPG()" style="background:#00aa00;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:12px">EPG ON ✅</button>
  </div>
  <div class="epg-now" style="margin-top:8px">📺 <b>Abhi :</b> <span id="epgNowText">Channel Chuno Sir!</span></div>
  <div class="epg-next">⏭️ <b>Agle :</b> <span id="epgNextText">-</span></div>
</div>

<div class="quality-bar">
  <div style="display:flex;gap:10px;align-items:center">
    <label for="qualitySelect">Quality:</label>
    <select id="qualitySelect" onchange="changeQuality()"><option value="auto" selected>Auto</option></select>
  </div>
  <div class="q-info" id="qualityInfo">Auto - Chrome khud best quality lega</div>
</div>
<div class="filter-container"><div class="filter-title">Languages</div><div class="filter-row" id="language-filters"></div></div>
<div class="filter-container"><div class="filter-title">Categories</div><div class="filter-row" id="category-filters"></div></div>
<div class="channels-section"><div class="filter-title">Available Channels</div><div class="channels-grid" id="channels-list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
let channelsData = [];
let activeLanguage='all', activeCategory='all';
let hls = null;
let video = document.getElementById('tv-player');
let M3U_URL = 'https://m3u-iptv.github.io/iptv/index.m3u';
let PROXIES = ['https://corsproxy.io/?url='];
let currentChannelObj = null;
let isFirstLoad = true;
let imgObserver = null;
function updateClock(){
  let el=document.getElementById('istClock'); if(!el) return;
  let now=new Date();
  el.innerText='🕐 IST Time : '+now.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,day:'2-digit',month:'short',year:'numeric'})+' | LIVE';
}
setInterval(updateClock,1000); updateClock();
let currentChannelSafeName='LIVE';
let onlineTimer=null;
function makeSafeName(n){ return (n||'LIVE').replace(/[^a-zA-Z0-9]/g,'_').substring(0,40); }
function refreshOnlineCount(){
  let run=()=>{ fetch('https://abacus.jasoncameron.dev/info/m3u-iptv-online/'+currentChannelSafeName).then(r=>r.json()).then(j=>{ let c=j.value||1; if(c<1)c=1; let el=document.getElementById('onlineCount'); if(el) el.innerText='👁️ '+c.toLocaleString('en-IN')+' Online Dekh Rahe Hai'; }).catch(()=>{}); };
  if(window.requestIdleCallback) requestIdleCallback(run,{timeout:2000}); else setTimeout(run,0);
}
function startOnlineCounter(name){
  currentChannelSafeName=makeSafeName(name);
  let el=document.getElementById('liveChannelName'); if(el) el.innerText='🔴 LIVE : '+name;
  fetch('https://abacus.jasoncameron.dev/hit/m3u-iptv-online/'+currentChannelSafeName).catch(()=>{});
  refreshOnlineCount();
  if(onlineTimer) clearInterval(onlineTimer);
  onlineTimer=setInterval(refreshOnlineCount,15000);
}
window.addEventListener('beforeunload',()=>{ try{ navigator.sendBeacon('https://abacus.jasoncameron.dev/decrement/m3u-iptv-online/'+currentChannelSafeName); }catch(e){} },{passive:true});

// ✅ EPG ALL CHANNELS - ANDAR HI CHALEGA, BAHAR KUCH NAHI DIKHAYEGA
let EPG_URLS = ['https://m3u-iptv.github.io/iptv/epg.xml.gz','epg.xml.gz'];
let epgOn=true, epgCache={}, epgNameToId={}, epgNormToId={}, epgAllIds=[], epgFetched=false, epgFetching=false, epgLastChannel='', epgFullText=null;
function toggleEPG(){
  epgOn=!epgOn; let b=document.getElementById('epgToggleBtn');
  if(epgOn){ b.innerText='EPG ON ✅'; b.style.background='#00aa00'; if(currentChannelObj){ epgLastChannel=''; updateEPG(currentChannelObj); } }
  else{ b.innerText='EPG OFF ❌'; b.style.background='#666'; document.getElementById('epgNowText').innerText='EPG OFF Hai Sir!'; document.getElementById('epgNextText').innerText='-'; }
}
function parseEPGTime(s){
  if(!s) return null;
  try{
    s=s.trim();
    let datePart=s.substring(0,14);
    let tzPart=s.substring(14).trim();
    let y=+datePart.substring(0,4), mo=+datePart.substring(4,6), dd=+datePart.substring(6,8), h=+datePart.substring(8,10), mi=+datePart.substring(10,12), sec=+datePart.substring(12,14);
    if(tzPart && (tzPart[0]==='+'||tzPart[0]==='-')){
      let sign=tzPart[0]==='+'?1:-1, th=+(tzPart.substring(1,3)||0), tm=+(tzPart.substring(3,5)||0);
      return new Date(Date.UTC(y,mo-1,dd,h,mi,sec) - sign*(th*60+tm)*60000);
    }
    return new Date(Date.UTC(y,mo-1,dd,h,mi,sec) - 5.5*60*60000);
  }catch(e){ return null; }
}
function fmtTime(dt){ return dt?dt.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true}):''; }
function normalizeName(s){
  if(!s) return '';
  return s.toLowerCase().replace(/\.in|\.com|\.tv|\.live/g,'').replace(/[^a-z0-9]/g,'').replace(/hd|fhd|4k|uhd|sd/g,'').replace(/channel|tv|live/g,'').trim();
}
function buildEPGMaps(txt){
  epgNameToId={}; epgNormToId={}; epgAllIds=[];
  let re=/<channel id="([^"]+)">[\s\S]*?<display-name[^>]*>([^<]+)<\/display-name>/g;
  let m;
  while((m=re.exec(txt))!==null){
    let id=m[1], name=m[2].trim();
    epgNameToId[name.toLowerCase()]=id;
    let norm=normalizeName(name); if(norm) epgNormToId[norm]=id;
    let normId=normalizeName(id); if(normId) epgNormToId[normId]=id;
    if(!epgAllIds.includes(id)) epgAllIds.push(id);
  }
  if(epgAllIds.length===0){
    let re2=/<programme[^>]*channel="([^"]+)"/g; let seen=new Set();
    while((m=re2.exec(txt))!==null){ if(!seen.has(m[1])){ seen.add(m[1]); epgAllIds.push(m[1]); let n=normalizeName(m[1]); if(n) epgNormToId[n]=m[1]; } if(epgAllIds.length>10000) break; }
  }
}
async function loadAllEPG(){
  if(epgFetched) return true; if(epgFetching) return false;
  epgFetching=true;
  for(let url of EPG_URLS){
    try{
      let res=await fetch(url, {cache:'force-cache'}); if(!res.ok) continue;
      let buf=await res.arrayBuffer(); let bytes=new Uint8Array(buf); let txt='';
      try{ if(bytes[0]===0x1f && bytes[1]===0x8b) txt=new TextDecoder().decode(pako.ungzip(bytes)); else txt=new TextDecoder().decode(bytes); }catch(e){ txt=new TextDecoder().decode(bytes); }
      if(!txt || !txt.includes('<programme')) continue;
      buildEPGMaps(txt);
      epgFullText=txt;
      epgFetched=true; epgFetching=false;
      return true;
    }catch(e){}
  }
  epgFetching=false; return false;
}
function findProgramForAnyChannel(ch){
  if(!epgFullText) return null;
  let cands=[];
  if(ch.tvgId) cands.push(ch.tvgId);
  if(ch.name) cands.push(ch.name);
  let normCh=normalizeName(ch.name||'');
  let normId=normalizeName(ch.tvgId||'');
  if(normCh && epgNormToId[normCh]) cands.push(epgNormToId[normCh]);
  if(normId && epgNormToId[normId]) cands.push(epgNormToId[normId]);
  if(ch.tvgId && ch.tvgId.includes('.')) cands.push(ch.tvgId.split('.')[0]);
  for(let norm in epgNormToId){
    if(!norm || !normCh) continue;
    if(norm===normCh || norm.includes(normCh) || normCh.includes(norm)){
      if(normCh.length>=4) cands.push(epgNormToId[norm]);
    }
    if(cands.length>15) break;
  }
  for(let id of cands){
    if(!id) continue;
    if(epgCache[id]) return epgCache[id];
    let esc=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let re=new RegExp('<programme[^>]*channel="'+esc+'"[^>]*>(.*?)</programme>','gs');
    let m, all=[], now=new Date();
    while((m=re.exec(epgFullText))!==null){
      let f=m[0], sm=f.match(/start="([^"]+)"/), em=f.match(/stop="([^"]+)"/);
      let st=parseEPGTime(sm?sm[1]:''), sp=parseEPGTime(em?em[1]:'');
      if(!st || !sp) continue;
      if(sp.getTime() < now.getTime() - 2*60*60*1000) continue;
      if(st.getTime() > now.getTime() + 12*60*60*1000) continue;
      let tm=f.match(/<title[^>]*>([^<]*)<\/title>/);
      let dm=f.match(/<desc[^>]*>([^<]*)<\/desc>/);
      all.push({start:st,stop:sp,title:tm?tm[1].trim():'Program',desc:dm?dm[1].trim():''});
    }
    if(all.length){ all.sort((a,b)=>a.start-b.start); epgCache[id]=all; return all; }
  }
  return null;
}
async function updateEPG(ch){
  currentChannelObj=ch; if(!ch||!epgOn) return; if(epgLastChannel===ch.name) return;
  epgLastChannel=ch.name;
  document.getElementById('epgNowText').innerText='EPG Dhoondh Rahe Hai... ⏳'; document.getElementById('epgNextText').innerText='-';
  let ok=await loadAllEPG(); if(!ok){ document.getElementById('epgNowText').innerText='EPG Nahi Mila Sir!'; epgLastChannel=''; return; }
  let list=findProgramForAnyChannel(ch);
  if(!list){ document.getElementById('epgNowText').innerText='Is Channel Ka Program Info Nahi Mila Sir!'; return; }
  let now=new Date(), cur=null, nxt=null;
  for(let i=0;i<list.length;i++){ if(now>=list[i].start && now<list[i].stop){ cur=list[i]; nxt=list[i+1]||null; break; } if(now<list[i].start){ nxt=list[i]; break; } }
  if(cur) document.getElementById('epgNowText').innerText=cur.title+' ('+fmtTime(cur.start)+' - '+fmtTime(cur.stop)+')'+(cur.desc?' | '+cur.desc.substring(0,80):'');
  else if(nxt) document.getElementById('epgNowText').innerText='Abhi Koi Program Nahi - Agla Neeche Hai';
  else document.getElementById('epgNowText').innerText='Aaj Ka Program Khatam!';
  if(nxt) document.getElementById('epgNextText').innerText=nxt.title+' ('+fmtTime(nxt.start)+' - '+fmtTime(nxt.stop)+')';
  else document.getElementById('epgNextText').innerText='-';
}
function parseM3U(text){
  let lines=text.split('\n'), cur=null, arr=[];
  for(let i=0;i<lines.length;i++){
    let line=lines[i].trim();
    if(line.startsWith('#EXTINF')){
      let name=line.split(',').pop()||'Channel';
      let logo=(line.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      let tvgId=(line.match(/tvg-id="([^"]*)"/)||[])[1]||'';
      let lang=(line.match(/tvg-language="([^"]*)"/)||[])[1]||'Others';
      let cat=(line.match(/group-title="([^"]*)"/)||[])[1]||'Entertainment';
      cur={name,logo,lang,cat,url:'',tvgId};
    } else if(line.startsWith('http') && cur){ cur.url=line; arr.push(cur); cur=null; }
  }
  return arr;
}
async function fetchM3U(){
  try{ let r=await fetch(M3U_URL+'?t='+Date.now(),{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.includes('#EXTINF')) return t; } }catch(e){}
  try{ let r=await fetch('index.m3u?t='+Date.now()); if(r.ok) return await r.text(); }catch(e){}
  return '';
}
async function loadFromM3U(isAuto){
  if(!isAuto) document.getElementById('status').innerText='Loading... ⏳';
  let text=await fetchM3U(); if(!text) return;
  channelsData=parseM3U(text); if(!channelsData.length) return;
  document.getElementById('status').innerText=channelsData.length+' Channels Load ✅';
  buildFilters(); loadChannels();
  if(isFirstLoad){ isFirstLoad=false; if(channelsData.length) changeChannel(channelsData[0].url, channelsData[0]); }
}
setInterval(()=>{ loadFromM3U(true); }, 20*60*1000);
function buildFilters(){
  let langs=['all',...new Set(channelsData.map(c=>c.lang))];
  let cats=['all',...new Set(channelsData.map(c=>c.cat))];
  document.getElementById('language-filters').innerHTML=langs.map(l=>`<button class="filter-btn ${l==='all'?'active':''}" onclick="filterLanguage('${l}',this)">${l==='all'?'All Languages':l}</button>`).join('');
  document.getElementById('category-filters').innerHTML=cats.map(c=>`<button class="filter-btn ${c==='all'?'active':''}" onclick="filterCategory('${c}',this)">${c==='all'?'All Categories':c}</button>`).join('');
}
function setupLazyImages(){
  if(imgObserver) imgObserver.disconnect();
  imgObserver=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ let img=en.target; if(img.dataset.src){ img.src=img.dataset.src; img.removeAttribute('data-src'); } imgObserver.unobserve(img); } });
  },{rootMargin:'200px'});
  document.querySelectorAll('.channel-card img[data-src]').forEach(img=>imgObserver.observe(img));
}
function loadChannels(){
  let grid=document.getElementById('channels-list'); grid.innerHTML='';
  let filtered=channelsData.filter(ch=>(activeLanguage==='all'||ch.lang===activeLanguage)&&(activeCategory==='all'||ch.cat===activeCategory));
  if(!filtered.length){ grid.innerHTML='<div style="color:#aaa;padding:20px;text-align:center">Is filter me koi channel nahi hai</div>'; return; }
  let frag=document.createDocumentFragment();
  filtered.forEach(ch=>{
    let d=document.createElement('div'); d.className='channel-card';
    let img=document.createElement('img'); img.dataset.src=ch.logo; img.src='data:image/svg+xml,[STRIPPED]'; img.loading='lazy'; img.onerror=()=>{ img.src='https://via.placeholder.com/60x45?text=TV'; };
    let sp=document.createElement('span'); sp.textContent=ch.name;
    let on=document.createElement('span'); on.className='card-online'; on.textContent='👁️ 1 Online';
    let br=document.createElement('br');
    d.appendChild(img); d.appendChild(sp); d.appendChild(br); d.appendChild(on);
    d.onclick=()=>{ epgLastChannel=''; changeChannel(ch.url,ch); };
    frag.appendChild(d);
  });
  grid.appendChild(frag); setupLazyImages();
}
function showErr(m){ let e=document.getElementById('err'); e.style.display='block'; e.innerHTML=m; }
function hideErr(){ document.getElementById('err').style.display='none'; }
function changeChannel(url,ch){
  startOnlineCounter(ch?ch.name:'LIVE TV');
  updateEPG(ch);
  let qs=document.getElementById('qualitySelect'); if(qs) qs.innerHTML='<option value="auto" selected>Auto</option>';
  let qi=document.getElementById('qualityInfo'); if(qi) qi.innerText='Auto - Chrome khud best lega...';
  playUrl(url,ch,0);
}
function playUrl(url,ch,attempt){
  hideErr();
  document.getElementById('status').innerText='Playing: '+(ch?ch.name:'');
  let playSrc=url;
  if(url.startsWith('http://')||attempt>0){ playSrc=PROXIES[0]+encodeURIComponent(url); }
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({maxBufferLength:8, maxMaxBufferLength:20, maxBufferSize:10*1000*1000, lowLatencyMode:true, liveSyncDurationCount:1, enableWorker:true, manifestLoadingMaxRetry:1, levelLoadingMaxRetry:1, fragLoadingMaxRetry:1, fragLoadingTimeOut:8000, manifestLoadingTimeOut:8000, backBufferLength:0});
    hls.loadSource(playSrc); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{ updateQualityDropdown(); video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); }); });
    hls.on(Hls.Events.ERROR,(e,data)=>{ if(data.fatal){ if(attempt<1){ playUrl(url,ch,attempt+1); } else { showErr('❌ Ye Link Band Hai Sir! Dusra Channel Try Karo!'); } } });
  } else { video.src=playSrc; video.play().catch(()=>{}); }
}
function updateQualityDropdown(){
  let select=document.getElementById('qualitySelect'), info=document.getElementById('qualityInfo');
  if(!select||!hls) return;
  select.innerHTML='<option value="auto" selected>Auto</option>';
  let seen=new Set(), levels=[];
  hls.levels.forEach((lv,i)=>{ let h=lv.height||0, label=h?h+'p':'Original'; if(seen.has(label)) return; seen.add(label); levels.push({index:i,label,height:h}); });
  levels.sort((a,b)=>b.height-a.height);
  levels.forEach(l=>{ let o=document.createElement('option'); o.value=l.index; o.text=l.label; select.appendChild(o); });
  if(info) info.innerText=levels.length?('Total '+levels.length+' Quality | Auto Best Hai'):'Sirf 1 Quality Hai';
}
function changeQuality(){
  let s=document.getElementById('qualitySelect'), info=document.getElementById('qualityInfo');
  if(!hls) return;
  if(s.value==='auto'){ hls.currentLevel=-1; if(info) info.innerText='Auto - Chrome khud best lega'; }
  else{ hls.currentLevel=+s.value; if(info) info.innerText='Fixed: '+s.options[s.selectedIndex].text; }
}
function filterLanguage(l,b){ activeLanguage=l; document.querySelectorAll('#language-filters .filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); loadChannels(); }
function filterCategory(c,b){ activeCategory=c; document.querySelectorAll('#category-filters .filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); loadChannels(); }
loadFromM3U(false);
</script>
</body>
</html>
